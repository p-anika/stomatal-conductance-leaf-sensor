# Every constant and setting for the project (spec Appendix B). Copied verbatim on 2026-11-04 (T0.2).
# Do not change a value without a row in docs/decision_log.md.

physics:
  air_density_kg_m3: 1.204
  specific_heat_air_j_kg_k: 1005.0
  gamma_pa_per_k_per_hpa: 0.0665        # FAO-56: 0.665e-3 x P[kPa] kPa/K
  stefan_boltzmann: 5.670374419e-8
  leaf_emissivity_longwave: 0.97
  rbw_to_rbh_ratio: 0.93                # verify; effect on g_s about 2 percent
  faces: 2                              # 1 or 2 (Section 4, A5); the ONE switch for longwave, r_b sidedness and the g_s convention
  include_longwave: true
  characteristic_dimension: d_min       # d_min or d_eq
  min_abs_rn_wm2: 1.0
  min_card_absorbed_sw_wm2: 40.0        # placeholder gate for card readings; set from calibrated noise after T7.5 (T1.3)
  allow_uncalibrated_k: false           # window and sunlight only; never honored for LED (T1.1)
  # Added in T1.2 (2026-11-08, see decision_log): constants that were literals in code.
  gas_constant_j_mol_k: 8.314           # Appendix A eq. 8
  gravity_m_s2: 9.81                    # Grashof number (A10)
  kelvin_offset: 273.15                 # degrees C to K
  tetens_a_pa: 610.78                   # Appendix A eq. 5
  tetens_b: 17.27
  tetens_c_c: 237.3
convection:                             # flat-plate baseline (A10, A11); verify every value in Campbell & Norman
  forced_nu_coeff: 0.66                 # laminar plate
  enhancement_factor: 1.0               # UNVERIFIED: 1.0 until checked; sources give 1.4 to 1.5; C is proportional to 1/b
  free_nu_coeff: 0.54
  combination: sum                      # sum or max
  sidedness_factor: from_faces                 # always equals physics.faces; correlation assumed per face (UNVERIFIED); never set separately
  card_transfer_max_change: 0.15        # flag card_direct when r_b changes more than this from card to leaf temperature difference (A17)
  mixed_convection_ratio: 0.3           # free/forced conductance ratio that marks mixed convection
  wind_noise_floor_ms: 0.1              # readings below this count as zero forced flow; set by wind_check.py
  # Added in T1.2 (2026-11-08, see decision_log). All UNVERIFIED (docs/sources.md).
  kinematic_viscosity_m2_s: 1.51e-5     # air at 20 C, recalled from Campbell & Norman Table A.3; UNVERIFIED
  thermal_diffusivity_m2_s: 2.15e-5     # air at 20 C, recalled from Campbell & Norman Table A.3; UNVERIFIED
  min_grashof_delta_t_c: 0.5            # floor on |T_s - T_a| used only inside the Grashof number; placeholder, UNVERIFIED
methods:
  primary: card_direct                  # basis of all headline results
  secondary: ml_corrected               # reported only if it passes validation
  baseline: flat_plate                  # comparison method
  primary_card_id: null                 # card cut to a typical soybean leaflet shape and size
spatial:
  irradiance_factor_leaf: null          # c_leaf from light_field_map.py; 1.0 plus a flag until measured
  irradiance_factor_card: null          # c_card
  max_uniformity_spread: 0.05
  max_card_leaf_difference: 0.05
light_sources:
  window:   {a_s_leaf: 0.5,  k_wm2_per_lux: null}    # calibrate; fallback only with allow_uncalibrated_k
  led_lamp: {a_s_leaf: 0.85, k_wm2_per_lux: null}    # must be calibrated; no fallback exists
  sunlight: {a_s_leaf: 0.5,  k_wm2_per_lux: 0.00833} # outdoor reference only
card:
  a_s_card: null                        # measure or justify; matte black about 0.95
  emissivity: 0.95
  # Added in T1.3 (2026-11-08, see decision_log): a missing a_s_card raises CalibrationMissing
  # unless allow_default_a_s_card is true; then the placeholder is used and flagged a_s_default.
  allow_default_a_s_card: false
  a_s_card_placeholder: 0.95            # matte black, UNVERIFIED (docs/sources.md)
enumerations:
  genotype: [Houjaku_Kuwazu, Williams_82]
  water_treatment: [well_watered, drought_stressed]
  light_source: [window, led_lamp, sunlight]
  fan_state: ["off", low, high]         # "off" quoted in T2.1: unquoted, YAML reads it as false
  dry_reference_type: [none, card, vaseline_leaf]
  # Vegetative stages VE, VC, Vn (n = fully developed trifoliate nodes) and reproductive R1-R8.
  # Changed 2026-11-08 (decision_log): V split into VE, VC, V1-V15.
  reproductive_stage: [VE, VC, V1, V2, V3, V4, V5, V6, V7, V8, V9, V10, V11, V12, V13, V14, V15, R1, R2, R3, R4, R5, R6, R7, R8]
  background: [neutral_matte, other]    # added in T2.1 (2026-11-08); values from spec T2.1
acquisition:
  log_interval_sec: 5
  thermal_refresh_hz: 2
  thermal_storage: single_file          # thermal_frames.f32, appended (B13)
  fsync_every_frames: 12
  photo_interval_sec: 60
  roi_source: manual                    # manual or rgb_mask
  min_roi_pixels: 6
  # Added in T3.2 (2026-11-09, see decision_log):
  roi_mad_k: 3.0                        # trim ROI pixels more than k x 1.4826 x MAD from the median
  min_pixel_coverage: 1.0               # keep a thermal pixel only if this fraction lies inside the leaf mask
  warp_supersample: 4                   # sample points per thermal pixel side when warping an RGB mask
qc:                                     # Added in T3.3 (2026-11-09); ranges from spec T3.3
  ranges:                               # [low, high], inclusive; null = no limit
    air_temp_c: [-10.0, 50.0]
    humidity_pct: [0.0, 100.0]
    pressure_hpa: [900.0, 1100.0]
    lux: [0.0, null]
  thermal_range_c: [-10.0, 80.0]        # applied to every column in thermal_columns
  thermal_columns: [thermal_min_c, thermal_max_c, thermal_mean_c, leaf_temp_c, leaf_temp_median_c,
                    card_temp_c, wet_ref_temp_c]
  # Spike checks only on environment sensors and whole-frame thermal summaries, never on
  # leaf, card or wet-reference temperatures (would select data on the measured result).
  spike_columns: [air_temp_c, humidity_pct, pressure_hpa, lux, thermal_min_c, thermal_max_c,
                  thermal_mean_c]
  hampel_window: 7                      # rows, centred, odd; shrinks at the ends of the file
  hampel_n_sigma: 3.0
  mad_to_sigma: 1.4826                  # 1 / Phi^-1(0.75): MAD -> sigma for normal data (derived)
  # Minimum spike size: |x - median| must also exceed this. PLACEHOLDERS (owner 2026-11-09).
  spike_min_abs: {air_temp_c: 0.5, humidity_pct: 3.0, pressure_hpa: 1.0,
                  thermal_min_c: 1.0, thermal_max_c: 1.0, thermal_mean_c: 1.0}
  spike_min_rel: {lux: 0.2}             # fraction of the window median
  overflow_columns: [tsl_full_spectrum, tsl_infrared]
  overflow_count: 65535                 # 16-bit full scale; OPEN: use adafruit_tsl2591's own limit (check on Pi)
  timestamp_columns: [timestamp_iso, timestamp]   # first one present is checked for duplicates
clock:
  min_valid_date: "2026-10-01"           # refuse to start if the system time is earlier (B14)
  allow_unsynced: false
windows:
  window_sec: 60
  min_samples: 10
  stability_minutes: 3
  stability_slope_c_per_min: 0.05
  min_acclimation_minutes: 30
  card_match_minutes: 10                # used only with card_source: nearest_window
  # Added 2026-11-11 (decision_log, option C): card_direct uses ONE session-pooled card r_bH (ratio of sums
  # over all steady, light-gated card windows, including delta T <= 0). nearest_window = the old rule.
  card_source: session_pooled
  wind_variation_max_frac: 0.2          # PLACEHOLDER: flag wind_varies_in_session when (max-min)/median wind > this
  max_photo_gap_sec: 120                # photo-to-window join (B15)
  # Changed in T3.4 (2026-11-09, decision_log): was leaf_moved_cv. Owner chose a range test:
  # flag leaf_moved when (max - min) / median of d_min_mm over the session's ok photos exceeds this.
  leaf_moved_range_frac: 0.05
  acclimation_reset_label: lamp_on      # an events.csv label that restarts the light-acclimation clock (T3.4)
segmentation:                           # Added in T3.1 (2026-11-09). ALL PLACEHOLDERS: tune on Arducam photos (BLOCKED-CAM)
  modes: [leaf, card]                   # leaf = excess green (2G - R - B); card = dark object on light background
  blur_ksize_px: 5                      # Gaussian blur (odd) before Otsu, to stop pixel noise splitting the threshold
  open_kernel_px: 5                     # morphological opening (odd): removes specks smaller than this
  close_kernel_px: 9                    # morphological closing (odd): bridges gaps narrower than this
  min_component_px: 200                 # pieces smaller than this are ignored when counting n_components
  min_area_mm2: 100.0                   # plausible object area, mm2 (1 cm2); outside -> segmentation_failed
  max_area_mm2: 20000.0                 # 200 cm2; a large soybean leaflet is well below this
  canny_low: 50                         # Canny hysteresis thresholds (grey levels 0-255) for edge_density
  canny_high: 150
  edge_erode_px: 5                      # shrink the mask by this before counting edges, so the outline is not counted
  max_incidence_angle_deg: 60.0         # above this, area / cos(angle) is too sensitive to angle error
  min_contrast: 30.0                    # mean ExG (leaf) or darkness (card) inside minus outside the mask, colour levels
sensors:
  fs3000: {enabled: false, variant: 1005}
  # Added 2026-11-11 (T7.1/M1, decision_log). FS3000-1005 count -> m/s from the Renesas FS3000 datasheet
  # (REN_FS3000_DST_20220531.pdf, R36DS0009EU0100 Rev.1.00, Figure 2 table). OWNER: confirm visually against the PDF.
  # No 1015 table on purpose. Linear interpolation between points is an ASSUMPTION; <= 409 -> 0 m/s; > 3686 -> overflow.
  # Accuracy 5 % of full scale (about +/- 0.36 m/s for the 1005).
  fs3000_table_1005: {counts: [409, 915, 1522, 2066, 2523, 2908, 3256, 3572, 3686],
                      wind_ms: [0.0, 1.07, 2.01, 3.00, 3.97, 4.96, 5.98, 6.99, 7.23]}
  fs3000_i2c_address: 0x28               # datasheet 5.1.1; confirm with i2cdetect
  bme280: {enabled: true}
  tsl2591: {enabled: true, start_gain: high, allow_max_gain: false}   # T7.1: step down only (high -> medium -> low)
  mlx90640_max_retries: 5                # T7.1: retry getFrame on ValueError
  # Simulated sensors (T7.1/M2). INVENTED values, only for laptop runs and tests.
  simulated:
    air_temp_c: 24.0
    humidity_pct: 50.0
    pressure_hpa: 995.0
    noise_sd: {air_temp_c: 0.05, humidity_pct: 0.5, pressure_hpa: 0.1, lux_fraction: 0.01, wind_ms: 0.05, pixel_c: 0.1}
    lux_by_light_source: {led_lamp: 12000.0, window: 20000.0, sunlight: 60000.0}
    wind_ms_by_fan_state: {"off": [0.0, 0.05], low: [0.5, 1.0], high: [1.5, 3.0]}   # [low, high] range; mean = midpoint
    leaf_offset_c: -1.0                  # simulated leaf block relative to air
    card_offset_c: 2.5                   # simulated card block relative to air
    leaf_block: [8, 16, 10, 20]          # rows [start, stop), cols [start, stop) in the 24 x 32 frame
    card_block: [2, 6, 24, 30]
  arducam: {enabled: false, working_distance_mm: null, lens_position: null, resolution: [2304, 1296]}
  # Added in T3.2 (2026-11-09): field of view from Adafruit's 55 x 35 deg product listing;
  # confirm by imaging a known-size warm object at T7.4.
  mlx90640: {hfov_deg: 55, vfov_deg: 35}
uncertainty:
  # Every sigma below is a PRE-CALIBRATION PLACEHOLDER (Appendix B). Measured values go in
  # calibration.json under the same keys and override these (T1.5, decision_log 2026-11-08).
  sigma_leaf_temp_c: 1.0                # placeholders; replace after thermal calibration
  sigma_air_temp_c: 0.5
  sigma_rh_pct: 3.0
  sigma_lux_fraction: 0.15
  sigma_lux_fraction_uncalibrated: 0.5  # used when k_uncalibrated is flagged
  sigma_rb_fraction: 0.2
  sigma_rn_card_fraction: 0.1           # card irradiance mismatch (A16)
  n_draws: 2000
  max_relative_width: 1.0               # (p97.5 - p2.5) / median must be below this to count as resolved
  dl_min_resolved_fraction: 0.9         # detection limit definition (A15)
  # Added in T1.5 (2026-11-08, see decision_log):
  rho_leaf_air_temp: 0.0                # correlation of leaf and air temperature errors (shared reference thermometer); 0 = widest intervals
  g_s_cap_mol: 2.0                      # top of measurable range, mol m-2 s-1; UNVERIFIED. An upper bound at the cap means "not bounded above"
  # Added in T6.1 (2026-11-10, see decision_log): A43 correlated draws. true = card_direct windows share ONE
  # thermal-offset draw and ONE air-temperature draw with their matched card, and r_bH is re-solved from the
  # card in every draw (eq. 9). false = r_bH drawn lognormal from the card interval (independent; unchanged).
  card_leaf_shared_draws: false
  dl_grid_min_mol: 0.001                # detection-limit search grid (log spaced) from here up to g_s_cap_mol
  dl_grid_points: 60
jones:                                  # Added in T1.6 (2026-11-08); values from spec T1.6
  min_leaf_wet_diff_c: 0.2              # I_g above_range when T_leaf - T_wet is below this
  min_dry_wet_diff_c: 1.0               # references_not_bracketing when T_dry - T_wet is below this
ml:
  min_shapes: 10
  min_improvement: 0.05
  n_bootstrap: 200
  features: [d_min_mm, d_eq_mm, aspect_ratio, eccentricity, solidity, circularity, edge_density, incidence_angle_deg, wind_ms]
  # Added in T4.3-T4.5 (2026-11-09, see decision_log). Model settings are PLACEHOLDERS, not tuned.
  max_suspect_fraction: 0.02            # warn when more gated card windows than this have r_bH <= 0 (truncation bias)
  ridge_alpha: 1.0                      # ridge penalty on standardised features
  forest_n_estimators: 100
  forest_max_depth: 3                   # shallow: few shapes, so keep the forest simple
  random_state: 0
  interval_level: 0.95                  # f_lo / f_hi coverage, assuming normal errors
validation:                             # Added in T5.2/T5.6 (2026-11-10, see decision_log)
  pair_max_minutes: 10                  # ground truth to device window midpoint, same plant (spec T5.2)
  surface_pair_minutes: 5               # adaxial + abaxial readings summed only if this close (E4 "a few minutes"); placeholder
  gravimetric_match_hours: 1.0          # device windows this close to a weighing go into the trend table; placeholder (A45)
  loa_z: 1.96                           # Bland-Altman limits of agreement = bias +/- loa_z x SD (95 % if differences are normal)
  n_split_bins: 3                       # tertiles for the shape-deviation and g_s-range splits (spec T5.2)
genotype_comparison:                    # Added in T5.3 (2026-11-10, see decision_log)
  reference_treatment: well_watered     # "drop under drought" is measured from this level
  ci_level: 0.95
  n_bootstrap: 2000                     # resample plants within each genotype x treatment group
  n_permutations: 2000                  # exact enumeration is used instead when it needs fewer arrangements
  random_seed: 0
  # Censored below_detection values are replaced by fraction x detection limit; above_range by uncertainty.g_s_cap_mol.
  censor_substitution: {zero: 0.0, half_dl: 0.5, dl: 1.0}
  primary_substitution: half_dl         # a conclusion is robust only if it holds under every substitution
dry_run:                                # Added in T6.1 (2026-11-10, see decision_log). processing/pipeline_dry_run.py ONLY.
  # Changed 2026-11-11 (owner, decision_log): was 120 s, set for the old fast settings; with full detection-limit
  # draws runs took 42-130 s on the laptop. Timing is machine-dependent; runtime is always reported.
  max_runtime_s: 300
  n_plants_per_group: 5
  plant_sd_fraction: 0.10               # plant-to-plant spread of the planted true g_s
  # Planted true g_s, mol m-2 s-1: genotype index (enumerations.genotype order) -> treatment. INVENTED.
  true_gs_mol:
    - {well_watered: 0.40, drought_stressed: 0.004}   # first genotype: stressed g_s near zero
    - {well_watered: 0.40, drought_stressed: 0.24}    # second genotype: 40 % drop
  min_first_genotype_drop_pct: 85.0     # check (c): planted drop is 99 %
  card_winds_ms: [0.8, 2.0]             # card training sessions per shape
  card_irradiance_wm2: 400.0
  leaf_wind_ms: 0.8                     # inside the training wind range
  leaf_duration_min: 8.0
  # "If this calibration is achieved" sigmas (T5.4 synthetic target); NOT measured.
  target_sigmas: {sigma_leaf_temp_c: 0.2, sigma_lux_fraction: 0.05}
  # Air-temperature and RH scenarios (owner 2026-11-11), added to the target sigmas; --air-rh picks one.
  # "If this calibration is achieved", NOT measured; 2 % RH may not be achievable with a BME280.
  air_rh_scenarios:
    placeholder:  {sigma_air_temp_c: 0.5, sigma_rh_pct: 3.0}   # = the uncertainty placeholders
    intermediate: {sigma_air_temp_c: 0.3, sigma_rh_pct: 2.5}
    target:       {sigma_air_temp_c: 0.2, sigma_rh_pct: 2.0}
    # Added 2026-11-11 (owner, decision_log): also relaxes the leaf (0.4 C instead of the 0.2 C target); light stays 5 %.
    relaxed:      {sigma_leaf_temp_c: 0.4, sigma_air_temp_c: 0.3, sigma_rh_pct: 3.0}
  # Fast settings for the 2-minute run; --settings full uses the normal config values.
  # Changed 2026-11-10 (T6.1 run 1, decision_log): uncertainty.n_draws and dl_grid_points are no longer
  # reduced here; the detection limit depends on n_draws, so the dry run uses the full values.
  fast: {ml: {n_bootstrap: 50, forest_n_estimators: 50}}
  # Applied in every dry run (owner 2026-11-10): card and leaf share the thermal and air draws (A43).
  overrides: {uncertainty: {card_leaf_shared_draws: true}}
  # No-effect check of the rank tests (T6.1 diagnostic). Moved from code 2026-11-11 (review). INVENTED values.
  null_check: {gs_mol: 0.40, plant_sd_mol: 0.03, window_sd_mol: 0.03, n_plants: 5, n_windows: 6, alpha: 0.05}
card_selection_bias:                    # Added 2026-11-11 (decision_log design row). analysis/card_selection_bias.py ONLY. INVENTED.
  shape_seed: 0
  n_plants: 10                          # per group
  g_s_mol: 0.30
  g_s_drought_mol: 0.15                 # planted-effect design (50 % drop)
  low_irradiance_wm2: 60.0              # card absorbed about 57 W m-2 (gate 40)
  high_irradiance_wm2: 150.0            # light-difference design, group 2
  wind_ms: 0.8
  duration_min: 8.0
  sigmas_c: [0.2, 0.5, 1.0]             # shared thermal offset sigma (random design) and +/- fixed offsets
  n_draws: 200                          # point estimates only are measured
  dl_grid_points: 10
card_buoyancy:                          # Added in T5.9 (2026-11-10, see decision_log); threshold is convection.card_transfer_max_change
  leaf_delta_t_c: 1.0                   # leaf-like |T - T_air| that DECIDES card_transfer_unreliable (pre-registered)
  leaf_delta_t_low_c: 0.5               # also reported (= convection.min_grashof_delta_t_c floor)
  min_lamp_levels: 3                    # distinct lamp levels (sessions) per card shape x wind setting
  wind_setting_step_ms: 0.1             # session median wind rounded to this to define a wind setting
  ci_level: 0.95
  n_param_draws: 2000                   # draws of the fitted (a, b) for the fractional-change interval
  random_seed: 0
synthetic:                             # Added in T4.2 (2026-11-09). Used ONLY by ml/synthetic_data.py.
  # Every value here is invented for testing code. None is a measurement or a calibration.
  k_wm2_per_lux: 0.01                   # goes into a synthetic calibration dict, never into light_sources
  a_s_card: 0.95                        # synthetic card absorptivity (matches card.a_s_card_placeholder)
  train_seed: 0
  test_seed: 1                          # held-out set (owner 2026-11-09)
  n_shapes: 20
  # Hidden correction f = 1 + a (1 - solidity) + b (aspect_ratio - 1) + c edge_density + N(0, noise_sd)
  correction_a: 0.8
  correction_b: 0.15
  correction_c: 2.0
  correction_noise_sd: 0.05
  solidity_range: [0.7, 1.0]
  aspect_ratio_range: [1.0, 3.0]
  edge_density_range: [0.0, 0.1]
  d_min_mm_range: [20.0, 60.0]
  card_thickness_mm: 1.0
  # Per-sample random noise (one 5 s row); NOT the per-window uncertainty sigmas.
  noise: {leaf_temp_c: 0.1, card_temp_c: 0.1, air_temp_c: 0.05, humidity_pct: 0.5,
          pressure_hpa: 0.1, lux_fraction: 0.01, wind_ms: 0.02}
  # true: draw one offset per session from the uncertainty sigmas (thermal offset shared by
  # leaf and card, one camera); recorded in the truth table. Off by default.
  session_bias: false
  conditions: {air_temp_c: 24.0, humidity_pct: 50.0, pressure_hpa: 995.0, irradiance_wm2: 120.0,
               wind_ms: 0.5, duration_min: 15.0, acclimation_minutes: 40.0}
  start_iso: "2026-11-09T10:00:00+00:00"
  roi_n_px: 20                          # pixel counts written to leaf_n_px / card_n_px
  root_bracket_c: [-20.0, 40.0]         # search T_air + this range (deg C) for the energy-balance root
  # analysis/detection_limit.py (added 2026-11-10, T5.4): stand-ins for the empirical brackets
  # when no real vaseline-leaf or wet-reference sessions exist. Invented, mol m-2 s-1.
  bracket_dry_g_s_mol: 1.0e-6           # petroleum-jelly leaf: stomata sealed, g_s about 0
  bracket_wet_g_s_mol: 1000.0           # wet reference: r_s about 0 (0.04 s m-1)
  # ml/delta_t_sweep.py (added 2026-11-09): bias of mean card f vs card delta T. Invented settings.
  delta_t_sweep:
    irradiance_wm2: [60.0, 100.0, 200.0, 400.0, 800.0]   # incident on the card
    wind_ms: [0.8, 2.0]
    offset_scales: [0.0, 0.5, 1.0]      # x the uncertainty sigmas; 0 = per-sample noise only
    repeats: 10                         # sessions per card per setting
    duration_min: 6.0                   # 4 steady windows per session
